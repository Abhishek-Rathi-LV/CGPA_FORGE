  <!-- Main React Application Script -->
  <script type="text/babel">
    const IPU_RULES = {
      name: "Guru Gobind Singh Indraprastha University (GGSIPU)",
      gradingScale: [
        { min: 90, max: 100, grade: "O",  point: 10, description: "Outstanding" },
        { min: 75, max: 89,  grade: "A+", point: 9,  description: "Excellent" },
        { min: 65, max: 74,  grade: "A",  point: 8,  description: "Very Good" },
        { min: 55, max: 64,  grade: "B+", point: 7,  description: "Good" },
        { min: 50, max: 54,  grade: "B",  point: 6,  description: "Above Average" },
        { min: 45, max: 49,  grade: "C",  point: 5,  description: "Average" },
        { min: 40, max: 44,  grade: "P",  point: 4,  description: "Pass" },
        { min: 0,  max: 39,  grade: "F",  point: 0,  description: "Fail" }
      ],
      getGradeInfoByMarks(marks) {
        if (marks === null || marks === undefined || isNaN(marks) || marks < 0 || marks > 100) {
          return null;
        }
        const numeric = Number(marks);
        for (const item of this.gradingScale) {
          if (numeric >= item.min && numeric <= item.max) {
            return item;
          }
        }
        return { grade: "F", point: 0, description: "Fail" };
      },
      getGradeInfoByGrade(gradeStr) {
        const found = this.gradingScale.find(g => g.grade.toUpperCase() === gradeStr.trim().toUpperCase());
        return found || { grade: "F", point: 0, description: "Fail" };
      },
      calculateDivision(cgpa) {
        if (cgpa >= 10.0) {
          return {
            title: "Exemplary Performance",
            detail: "Subject to conditions specified in IPU Ordinance 11 (first attempt passing of all courses)."
          };
        } else if (cgpa >= 6.50) {
          return {
            title: "First Division",
            detail: "Eligible for standard First Class honors criteria across IPU colleges."
          };
        } else if (cgpa >= 5.00) {
          return {
            title: "Second Division",
            detail: "Satisfies degree award requirements for Second Division."
          };
        } else if (cgpa >= 4.00) {
          return {
            title: "Third Division",
            detail: "Minimum qualifying division for award of undergraduate/postgraduate degree."
          };
        } else {
          return {
            title: "Not Qualified",
            detail: "CGPA below 4.00 does not meet the minimum standard for degree completion."
          };
        }
      },
      percentageEquivalent(cgpa) {
        // Source of truth: Percentage = CGPA * 10
        return (cgpa * 10).toFixed(2);
      }
    };

    const SAMPLE_SEMESTER_SUBJECTS = [
      { id: "s1", code: "IT-201", name: "Data Structures & Algorithms", credits: 4, mode: "marks", marks: 84, grade: "A+", point: 9 },
      { id: "s2", code: "IT-203", name: "Database Management Systems", credits: 4, mode: "marks", marks: 78, grade: "A+", point: 9 },
      { id: "s3", code: "IT-205", name: "Computer Architecture", credits: 4, mode: "marks", marks: 68, grade: "A", point: 8 },
      { id: "s4", code: "BA-211", name: "Principles of Management", credits: 3, mode: "marks", marks: 72, grade: "A", point: 8 },
      { id: "s5", code: "IT-251", name: "Data Structures Lab", credits: 1, mode: "marks", marks: 92, grade: "O", point: 10 },
      { id: "s6", code: "IT-253", name: "DBMS Laboratory", credits: 1, mode: "marks", marks: 91, grade: "O", point: 10 }
    ];

    const SAMPLE_MULTI_SEMESTERS = [
      { id: "sem-1", name: "Semester 1", sgpa: 8.25, credits: 24 },
      { id: "sem-2", name: "Semester 2", sgpa: 8.70, credits: 24 },
      { id: "sem-3", name: "Semester 3", sgpa: 8.45, credits: 26 },
      { id: "sem-4", name: "Semester 4", sgpa: 8.90, credits: 26 }
    ];

    const DEFAULT_SUBJECTS = Array.from({ length: 8 }, (_, i) => ({
      id: `default-subject-${i + 1}`, code: `SUB-${i + 1}`, name: `Subject ${i + 1}`,
      credits: 4, mode: "marks", marks: "", grade: "—", point: null
    }));
    const readStoredArray = (key, fallback) => {
      try {
        const stored = JSON.parse(localStorage.getItem(key));
        return Array.isArray(stored) ? stored : fallback;
      } catch { return fallback; }
    };

    function App() {
      const [activeTab, setActiveTab] = useState("sgpa"); // "sgpa" | "cgpa" | "target" | "whatif" | "scale" | "history"

      // SGPA state
      const [subjects, setSubjects] = useState(() => {
        const stored = readStoredArray("cgpaforge_current_subjects", null);
        const migrationKey = "cgpaforge_blank_default_v2";

        // Never show fabricated marks/SGPA on a fresh calculator.
        // Migrate only known starter/sample datasets from older builds; preserve any real user-entered work.
        if (!localStorage.getItem(migrationKey)) {
          localStorage.setItem(migrationKey, "1");
          const isOldTwoRowStarter = stored && stored.length === 2 && stored.every((s, i) => s.name === `Subject ${i + 1}`);
          const isKnownSample = stored && stored.length === SAMPLE_SEMESTER_SUBJECTS.length &&
            stored.every((s, i) => s.name === SAMPLE_SEMESTER_SUBJECTS[i].name && Number(s.marks) === SAMPLE_SEMESTER_SUBJECTS[i].marks);
          if (isOldTwoRowStarter || isKnownSample) return DEFAULT_SUBJECTS.map(s => ({ ...s }));
        }
        return stored || DEFAULT_SUBJECTS.map(s => ({ ...s }));
      });
      const [semesterTitle, setSemesterTitle] = useState("Current IPU Semester");

      // Multi-semester CGPA state
      const [semesters, setSemesters] = useState(() => {
        return readStoredArray("cgpaforge_current_semesters", SAMPLE_MULTI_SEMESTERS);
      });

      // Target CGPA state
      const [targetCurrentCGPA, setTargetCurrentCGPA] = useState(7.85);
      const [targetCompletedCredits, setTargetCompletedCredits] = useState(72);
      const [targetRemainingCredits, setTargetRemainingCredits] = useState(48);
      const [targetDesiredCGPA, setTargetDesiredCGPA] = useState(8.50);

      // What-If Simulator state
      const [whatIfSubjectId, setWhatIfSubjectId] = useState("");
      const [whatIfHypotheticalGrade, setWhatIfHypotheticalGrade] = useState("O");

      // Quick Marks -> Grade finder
      const [quickMarksInput, setQuickMarksInput] = useState(82);

      // Calculation History state
      const [history, setHistory] = useState(() => {
        return readStoredArray("cgpaforge_history", []);
      });
      const [saveLabel, setSaveLabel] = useState("");
      const [showSaveToast, setShowSaveToast] = useState(false);
      const [showResetModal, setShowResetModal] = useState(false);
      const [showCalculationsBreakdown, setShowCalculationsBreakdown] = useState(true);

      // Persist ongoing work locally
      useEffect(() => {
        localStorage.setItem("cgpaforge_current_subjects", JSON.stringify(subjects));
      }, [subjects]);

      useEffect(() => {
        localStorage.setItem("cgpaforge_current_semesters", JSON.stringify(semesters));
      }, [semesters]);

      useEffect(() => {
        localStorage.setItem("cgpaforge_history", JSON.stringify(history));
      }, [history]);

      // Initialize default whatIfSubjectId when subjects load
      useEffect(() => {
        if (subjects.length > 0 && !whatIfSubjectId) {
          setWhatIfSubjectId(subjects[0].id);
        }
      }, [subjects, whatIfSubjectId]);

      // Render Lucide icons on update
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const calculateSGPAMetrics = (subjList) => {
        let totalCredits = 0;
        let totalQualityPoints = 0;
        let validSubjectsCount = 0;
        let hasErrors = false;

        subjList.forEach(s => {
          const cred = parseFloat(s.credits);
          const pt = s.point === null || s.point === "" ? NaN : parseFloat(s.point);
          const validMarks = s.mode !== "marks" || (s.marks !== "" && Number.isFinite(Number(s.marks)) && Number(s.marks) >= 0 && Number(s.marks) <= 100);

          if (validMarks && !isNaN(cred) && cred > 0 && !isNaN(pt) && pt >= 0 && pt <= 10) {
            totalCredits += cred;
            totalQualityPoints += (cred * pt);
            validSubjectsCount++;
          } else {
            hasErrors = true;
          }
        });

        const sgpa = totalCredits > 0 ? (totalQualityPoints / totalCredits) : 0;
        const roundedSGPA = Math.round(sgpa * 100) / 100;
        const percentage = totalCredits > 0 ? (roundedSGPA * 10).toFixed(2) : "0.00";
        const division = validSubjectsCount > 0 && !hasErrors ? IPU_RULES.calculateDivision(roundedSGPA) : { title: "—", detail: "Complete all subject entries to view a result." };

        return {
          totalCredits,
          totalQualityPoints: Math.round(totalQualityPoints * 100) / 100,
          sgpa: validSubjectsCount > 0 && !hasErrors ? roundedSGPA.toFixed(2) : "—",
          numericSGPA: roundedSGPA,
          percentage: validSubjectsCount > 0 && !hasErrors ? percentage : "—",
          division,
          validCount: validSubjectsCount,
          hasErrors
        };
      };

      const currentSGPAMetrics = useMemo(() => calculateSGPAMetrics(subjects), [subjects]);
      const hasEnteredMarks = subjects.some(s => s.mode === "marks" && s.marks !== "" && s.marks !== null && s.marks !== undefined);

      const calculateCGPAMetrics = (semList) => {
        let totalCredits = 0;
        let totalWeightedPoints = 0;
        let validCount = 0;

        semList.forEach(sem => {
          const cred = parseFloat(sem.credits);
          const sgpa = parseFloat(sem.sgpa);
          if (!isNaN(cred) && cred > 0 && !isNaN(sgpa) && sgpa >= 0 && sgpa <= 10) {
            totalCredits += cred;
            totalWeightedPoints += (cred * sgpa);
            validCount++;
          }
        });

        const cgpa = totalCredits > 0 ? (totalWeightedPoints / totalCredits) : 0;
        const roundedCGPA = Math.round(cgpa * 100) / 100;
        const percentage = totalCredits > 0 ? (roundedCGPA * 10).toFixed(2) : "0.00";
        const division = IPU_RULES.calculateDivision(roundedCGPA);

        return {
          totalCredits,
          totalWeightedPoints: Math.round(totalWeightedPoints * 100) / 100,
          cgpa: roundedCGPA.toFixed(2),
          numericCGPA: roundedCGPA,
          percentage,
          division,
          validCount
        };
      };

      const currentCGPAMetrics = useMemo(() => calculateCGPAMetrics(semesters), [semesters]);

      const targetAnalysis = useMemo(() => {
        const curCGPA = parseFloat(targetCurrentCGPA);
        const compCred = parseFloat(targetCompletedCredits);
        const remCred = parseFloat(targetRemainingCredits);
        const desCGPA = parseFloat(targetDesiredCGPA);

        if (isNaN(curCGPA) || isNaN(compCred) || isNaN(remCred) || isNaN(desCGPA) ||
            compCred <= 0 || remCred <= 0 || desCGPA <= 0 || curCGPA < 0) {
          return { valid: false, error: "Please enter valid numeric values for credits and CGPA." };
        }

        const totalCredits = compCred + remCred;
        const currentPoints = curCGPA * compCred;
        const targetTotalPoints = desCGPA * totalCredits;
        const requiredFuturePoints = targetTotalPoints - currentPoints;
        const requiredAvgSGPA = requiredFuturePoints / remCred;
        const roundedReq = Math.round(requiredAvgSGPA * 100) / 100;

          const isPossible = requiredAvgSGPA <= 10.0 + 1e-9;
        const isAlreadyAchieved = roundedReq <= 0;

        return {
          valid: true,
          totalCredits,
          currentPoints: currentPoints.toFixed(2),
          targetTotalPoints: targetTotalPoints.toFixed(2),
          requiredFuturePoints: requiredFuturePoints.toFixed(2),
          requiredAvgSGPA: roundedReq.toFixed(2),
          numericRequired: roundedReq,
          isPossible,
          isAlreadyAchieved
        };
      }, [targetCurrentCGPA, targetCompletedCredits, targetRemainingCredits, targetDesiredCGPA]);

      const whatIfMetrics = useMemo(() => {
        if (!whatIfSubjectId || subjects.length === 0) return null;
        const targetSubj = subjects.find(s => s.id === whatIfSubjectId);
        if (!targetSubj) return null;

        const simulatedInfo = IPU_RULES.getGradeInfoByGrade(whatIfHypotheticalGrade);
        const modifiedList = subjects.map(s => {
          if (s.id === whatIfSubjectId) {
            return {
              ...s,
              grade: simulatedInfo.grade,
              point: simulatedInfo.point
            };
          }
          return s;
        });

        const simMetrics = calculateSGPAMetrics(modifiedList);
        const currentSGPA = parseFloat(currentSGPAMetrics.sgpa);
        const simulatedSGPA = parseFloat(simMetrics.sgpa);
        const difference = (simulatedSGPA - currentSGPA).toFixed(2);

        return {
          targetSubject: targetSubj,
          simulatedGrade: simulatedInfo.grade,
          simulatedPoint: simulatedInfo.point,
          simulatedSGPA: simMetrics.sgpa,
          difference: Number(difference) > 0 ? `+${difference}` : difference,
          isGain: Number(difference) > 0,
          isLoss: Number(difference) < 0
        };
      }, [subjects, whatIfSubjectId, whatIfHypotheticalGrade, currentSGPAMetrics]);

      const handleAddSubject = () => {
        const newId = "subj_" + Date.now();
        const newSubj = {
          id: newId,
          code: `SUB-${subjects.length + 1}`,
          name: `Course ${subjects.length + 1}`,
          credits: 4,
          mode: "marks",
          marks: "",
          grade: "—",
          point: null
        };
        setSubjects([...subjects, newSubj]);
      };

      const handleRemoveSubject = (id) => {
        if (subjects.length <= 1) {
          return;
        }
        setSubjects(subjects.filter(s => s.id !== id));
      };

      const handleSubjectChange = (id, field, value) => {
        setSubjects(prev => prev.map(s => {
          if (s.id !== id) return s;
          const updated = { ...s };

          if (field === "name") {
            updated.name = value;
          } else if (field === "credits") {
            const num = value === "" ? "" : parseFloat(value);
            updated.credits = isNaN(num) ? 0 : num;
          } else if (field === "mode") {
            updated.mode = value;
            if (value === "marks") {
              const info = updated.marks !== "" ? IPU_RULES.getGradeInfoByMarks(updated.marks) : null;
              updated.grade = info ? info.grade : "—";
              updated.point = info ? info.point : null;
            } else {
              const info = IPU_RULES.getGradeInfoByGrade(updated.grade === "—" ? "O" : updated.grade);
              updated.grade = info.grade;
              updated.point = info.point;
            }
          } else if (field === "marks") {
            const num = value === "" ? "" : parseFloat(value);
            updated.marks = isNaN(num) ? "" : num;
            if (num !== "" && !isNaN(num) && num >= 0 && num <= 100) {
              const info = IPU_RULES.getGradeInfoByMarks(num);
              if (info) {
                updated.grade = info.grade;
                updated.point = info.point;
              }
            } else {
              updated.grade = "—";
              updated.point = null;
            }
          } else if (field === "grade") {
            const info = IPU_RULES.getGradeInfoByGrade(value);
            updated.grade = info.grade;
            updated.point = info.point;
          }

          return updated;
        }));
      };

      const handleAddSemester = () => {
        const semCount = semesters.length + 1;
        const newSem = {
          id: "sem_" + Date.now(),
          name: `Semester ${semCount}`,
          sgpa: 8.00,
          credits: 24
        };
        setSemesters([...semesters, newSem]);
      };

      const handleRemoveSemester = (id) => {
        if (semesters.length <= 1) return;
        setSemesters(semesters.filter(sem => sem.id !== id));
      };

      const handleSemesterChange = (id, field, value) => {
        setSemesters(prev => prev.map(sem => {
          if (sem.id !== id) return sem;
          const updated = { ...sem };
          if (field === "name") {
            updated.name = value;
          } else if (field === "sgpa") {
            const num = value === "" ? "" : parseFloat(value);
            updated.sgpa = isNaN(num) ? 0 : num;
          } else if (field === "credits") {
            const num = value === "" ? "" : parseFloat(value);
            updated.credits = isNaN(num) ? 0 : num;
          }
          return updated;
        }));
      };

      const handleSaveCalculation = () => {
        const title = saveLabel.trim() || semesterTitle || `Saved Calculation ${history.length + 1}`;
        const newRecord = {
          id: "hist_" + Date.now(),
          date: new Date().toLocaleDateString("en-IN", { month: "short", day: "numeric", year: "numeric" }),
          title,
          type: activeTab === "cgpa" ? "CGPA" : "SGPA",
          score: activeTab === "cgpa" ? currentCGPAMetrics.cgpa : currentSGPAMetrics.sgpa,
          credits: activeTab === "cgpa" ? currentCGPAMetrics.totalCredits : currentSGPAMetrics.totalCredits,
          subjects: [...subjects],
          semesters: [...semesters]
        };

        setHistory([newRecord, ...history]);
        setSaveLabel("");
        setShowSaveToast(true);
        setTimeout(() => setShowSaveToast(false), 3000);
      };

      const handleLoadHistory = (item) => {
        if (item.subjects && item.subjects.length > 0) {
          setSubjects(item.subjects);
        }
        if (item.semesters && item.semesters.length > 0) {
          setSemesters(item.semesters);
        }
        if (item.type === "CGPA") {
          setActiveTab("cgpa");
        } else {
          setActiveTab("sgpa");
        }
        setSemesterTitle(item.title);
      };

      const handleDeleteHistory = (id) => {
        setHistory(history.filter(h => h.id !== id));
      };

      const handleResetCalculator = () => {
        const freshSubjects = DEFAULT_SUBJECTS.map(s => ({ ...s }));
        setSubjects(freshSubjects);
        localStorage.setItem("cgpaforge_current_subjects", JSON.stringify(freshSubjects));
        setSemesterTitle("Current IPU Semester");
        setShowResetModal(false);
      };

      const handleLoadSample = () => {
        setSubjects(SAMPLE_SEMESTER_SUBJECTS);
        setSemesterTitle("B.Tech / BCA - Sample Semester");
      };

      const handlePrint = () => {
        window.print();
      };

      const [exportError, setExportError] = useState("");
      const [isExporting, setIsExporting] = useState(false);
      const handleExportPDF = async () => {
        setExportError("");
        if (currentSGPAMetrics.hasErrors || currentSGPAMetrics.validCount === 0) {
          setExportError("Complete every subject's marks or grade and credits before exporting.");
          return;
        }
        if (!window.jspdf || !window.jspdf.jsPDF) {
          setExportError("PDF library could not load. Check your internet connection and retry.");
          return;
        }

        setIsExporting(true);
        try {
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({
            orientation: "portrait",
            unit: "mm",
            format: "a4",
            compress: true
          });

          const W = 210;
          const H = 297;
          const M = 14;
          const right = W - M;
          const contentW = W - (M * 2);
          const safe = (value) =>
            String(value ?? "")
              .replace(/[^\x20-\x7E]/g, "-")
              .replace(/\s+/g, " ")
              .trim();

          let pageNo = 1;

                <div className="p-4 border-2 border-brand-black bg-brand-offwhite">
                  <h3 className="font-bold text-sm text-brand-black mb-1">What is the IPU CGPA formula?</h3>
                  <p className="text-xs text-gray-700 leading-normal font-sans">
                    The IPU CGPA formula is Σ(Cni × Gni) / ΣCni, where Cni represents course credits and Gni represents the grade points earned in that course, computed across all completed semesters.
                  </p>
                </div>

                <div className="p-4 border-2 border-brand-black bg-brand-offwhite">
                  <h3 className="font-bold text-sm text-brand-black mb-1">Does IPU use CGPA × 9.5 for percentage?</h3>
                  <p className="text-xs text-gray-700 leading-normal font-sans">
                    No. The 9.5 multiplier is commonly used by CBSE and other boards. GGSIPU officially defines the percentage equivalent as <strong>CGPA × 10</strong>.
                  </p>
                </div>

                <div className="p-4 border-2 border-brand-black bg-brand-offwhite">
                  <h3 className="font-bold text-sm text-brand-black mb-1">What grade point is an A+ in IPU?</h3>
                  <p className="text-xs text-gray-700 leading-normal font-sans">
                    In IPU, marks between 75 and 89 yield the letter grade <strong>A+</strong>, corresponding to <strong>9 grade points</strong>.
                  </p>
                </div>

                <div className="p-4 border-2 border-brand-black bg-brand-offwhite">
                  <h3 className="font-bold text-sm text-brand-black mb-1">Are my marks uploaded to a database?</h3>
                  <p className="text-xs text-gray-700 leading-normal font-sans">

                  </p>
                </div>
              </div>
